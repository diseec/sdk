services:
  sdk:
    image: "$IMAGE_REGISTRY_URL/$SDK_NAME"
    command: ["sleep", "infinity"]
    build:
      context: "$SDK_DIR"
    working_dir: "$WORK_DIR_CONTAINER"
    # environment:
    # - GIT_DISCOVERY_ACROSS_FILESYSTEM=1
    # - GIT_TERMINAL_PROMPT=0 # avoid interactive prompts
    volumes:
      - "$WORK_DIR_HOST:$WORK_DIR_CONTAINER"
      - "$HOME:/root"
      - "$GIT_DIRECTORY:$GIT_DIR_CONTAINER"
