services:
  kit:
    image: "$IMAGE_REGISTRY_URL/$KIT_NAME"
    command: ["sleep", "infinity"]
    build:
      context: "$KIT_DIR"
    working_dir: "/$PROJECT_MOUNT_DIR_NAME"
    # environment:
    # - GIT_DISCOVERY_ACROSS_FILESYSTEM=1
    # - GIT_TERMINAL_PROMPT=0 # avoid interactive prompts
    volumes:
      - "$TO_MOUNT_DIR:/$PROJECT_MOUNT_DIR_NAME"
      - "$HOME:/root"
