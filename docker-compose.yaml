services:
  sdk:
    image: "$D_REGISTRY_URL/$D_SDK_NAME"
    command: ["sleep", "infinity"]
    build:
      context: "$D_SDK_DIR"
    working_dir: "$D_CTX_DIR_CONTAINER"
    # environment:
    # - GIT_DISCOVERY_ACROSS_FILESYSTEM=1
    # - GIT_TERMINAL_PROMPT=0 # avoid interactive prompts
    volumes:
      - "$D_CTX_DIR_HOST:$D_CTX_DIR_CONTAINER"
      - "$HOME:/root"
      - "$D_GIT_DIR:$D_GIT_DIR_CONTAINER"
