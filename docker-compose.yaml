services:
  kit:
    image: "$IMAGE_REGISTRY_URL/$KIT_NAME"
    command: ["sleep", "infinity"]
    build:
      context: "$KIT_DIR"
    working_dir: "$TARGET_MOUNTED_DIR"
    # environment:
    # - GIT_DISCOVERY_ACROSS_FILESYSTEM=1
    # - GIT_TERMINAL_PROMPT=0 # avoid interactive prompts
    volumes:
      - "$KIT_TARGET_DIR:$TARGET_MOUNTED_DIR"
      - "$HOME:/root"
      - "$GIT_DIRECTORY:$GIT_MOUNT_DIR"
