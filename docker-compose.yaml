services:
  devops:
    image: ${IMAGE_REGISTRY_URL}/${KIT_NAME}
    # command: ["sleep", "infinity"]
    command: ["sleep", "300"]
    build:
      context: ${CLI_ROOT}
    restart: unless-stopped
    working_dir: ${PROJECT_MOUNT_DIR}
    # environment:
    #   - GIT_TERMINAL_PROMPT=0 # avoid interactive prompts
    volumes:
      - ${CLI_ROOT}:/app
      - ${ROOT_DIR}:${PROJECT_MOUNT_DIR}
      - ${HOME}:/root
