name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run install
        run: sh cli install

      - name: Run yarn build (test bundling)
        run: sh cli run sh -c "export NODE_ENV='production' && yarn build"

