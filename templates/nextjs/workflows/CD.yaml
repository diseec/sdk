name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load .env
        run: . "./bin/envs.sh";

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          push: true
          # tags: ${{ env.IMAGE_REGISTRY_URL }}/${{ env.REPO_NAME }}:${{ github.ref_name }}
          tags: ${{ env.IMAGE_REGISTRY_URL }}/${{ env.REPO_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_REGISTRY_URL }}/${{ env.REPO_NAME }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_REGISTRY_URL }}/${{ env.REPO_NAME }}:cache,mode=max

  deploy:
    needs: [build]
    runs-on: self-hosted
    container:
      image: alpine:latest

    steps:
      - name: Load .env
        run: . "./bin/envs.sh";

      - name: Update pods
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: cli update ${{ env.NAMESPACE }} ${{ env.SERVICE_NAME }}
