name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load .env
        run: . "./bin/envs.sh";

      # - name: Build and push
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     file: ./Dockerfile
      #     # platforms: linux/amd64,linux/arm64
      #     platforms: linux/amd64
      #     push: true
      #     # tags: ${{ env.IMAGE_REGISTRY_URL }}/${{ env.REPO_NAME }}:${{ github.ref_name }}
      #     tags: ${{ env.IMAGE_REGISTRY_URL }}/${{ env.REPO_NAME }}:latest
      #     cache-from: type=registry,ref=${{ env.IMAGE_REGISTRY_URL }}/${{ env.REPO_NAME }}:cache
      #     cache-to: type=registry,ref=${{ env.IMAGE_REGISTRY_URL }}/${{ env.REPO_NAME }}:cache,mode=max

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Log in to Your Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ env.IMAGE_REGISTRY_URL }}
      #     username: ${{ secrets.YOUR_REGISTRY_USERNAME }}
      #     password: ${{ secrets.YOUR_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY_URL }}/${{ env.REPO_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.REPO_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_REGISTRY_URL }}/${{ env.REPO_NAME }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_REGISTRY_URL }}/${{ env.REPO_NAME }}:cache,mode=max

  deploy:
    needs: [build]
    runs-on: self-hosted
    container:
      image: alpine:latest

    steps:
      # - name: Load .env
      #   run: . "./bin/envs.sh";

      - name: Extract namespace and service name
        run: |
          export NAMESPACE=$(echo "$REPO_NAME" | cut -d'-' -f1)
          export SERVICE_NAME=$(echo "$REPO_NAME" | cut -d'-' -f2-)
          echo "NAMESPACE=$NAMESPACE" >> $GITHUB_ENV
          echo "SERVICE_NAME=$SERVICE_NAME" >> $GITHUB_ENV

      - name: Update pods
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: D api v1 cd ${{ github.event.repository.name }}
