  tester:
    image: ${REGISTRY_URL}/tester-e2e-node
    pull_policy: always
    command: npx playwright test --ui-host=0.0.0.0 --ui-port=9323
    volumes:
      - .:/app
    ports:
      - 9323:9323
    depends_on:
      - app
