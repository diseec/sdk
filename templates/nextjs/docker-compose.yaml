services:
  www:
    image: ${IMAGE_REGISTRY_URL}/${REPO_NAME}
    build:
      context: .
    pull_policy: always
    restart: unless-stopped
    ports:
      - 80:3000
      - 3000:3000
    # networks:
    #   default:
    #     # This alias is required due to dns resolution issues
    #     # with 'app' word in chromium browsers when testing
    #     aliases:
    #       - www
    env_file:
      - .env.pro

