name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  prepare:
    runs-on: self-hosted
    container:
      image: alpine
    outputs:
      repo_name: ${{ steps.vars.outputs.repo_name }}
      project_id: ${{ steps.vars.outputs.project_id }}
      project_name: ${{ steps.vars.outputs.project_name }}
      image_name: ${{ steps.vars.outputs.image_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Generate dynamic values
        id: vars
        run: |
          REPO_NAME=$(basename $GITHUB_REPOSITORY)
          PROJECT_ID=$(echo $REPO_NAME | cut -d'-' -f1)
          PROJECT_NAME=$(echo $REPO_NAME | cut -d'-' -f2-)
          IMAGE_NAME="registry.diseec.com/${PROJECT_ID}-${PROJECT_NAME}:latest"
          echo "::set-output name=project_id::$PROJECT_ID"
          echo "::set-output name=project_name::$PROJECT_NAME"
          echo "::set-output name=image_name::$IMAGE_NAME"

  build:
    needs: [prepare]
    runs-on: self-hosted
    container:
      image: docker:latest
      options: --privileged
      volumes:
        - /var/lib/docker:/var/lib/docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Run build function from cli script
        run: sh cli build

  deploy:
    needs: [build]
    runs-on: self-hosted
    container:
      image: alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Update pods
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: cli update ${{ needs.prepare.outputs.project_id }} ${{ needs.prepare.outputs.project_name }}
