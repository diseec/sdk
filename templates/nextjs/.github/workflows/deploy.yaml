name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: self-hosted
    container:
      image: alpine:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Update pods
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sh /cli update placeholderforprojectid placeholderforprojectname
