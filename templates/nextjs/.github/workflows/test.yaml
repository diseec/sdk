name: Test

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted
    container:
      image: registry.diseec.com/placeholderforprojectid-placeholderforprojectname:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sh cli install

      - name: Run lint
        run: sh cli run npm run lint

      - name: Build bundle
        run: sh cli run npm run build
