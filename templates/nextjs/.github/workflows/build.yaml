name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted
    # container:
    #   image: docker:latest
    #   options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # - name: Run build function from cli script
      #   run: sh cli build

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: registry.diseec.com/placeholderforprojectid-placeholderforprojectname:latest
