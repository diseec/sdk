name: Build

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted
    container:
      image: registry.diseec.com/placeholderforprojectid-placeholderforprojectname:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sh cli install

      - name: Run lint
        run: sh cli run npm run lint

      - name: Build bundle
        run: sh cli run npm run build

  build:
    needs: test
    runs-on: self-hosted
    # container:
    #   image: docker:latest
    #   options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # - name: Run build function from cli script
      #   run: sh cli build

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: registry.diseec.com/placeholderforprojectid-placeholderforprojectname:latest
