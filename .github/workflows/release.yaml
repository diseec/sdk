name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: self-hosted
    container:
      image: node:20-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install dependencies
        run: npm install

      - name: Set package.json version from release tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          npm version --no-git-tag-version $TAG_VERSION

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # - name: Publish to npmjs.org
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      #   run: |
      #     echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
      #     npm publish --registry=https://registry.npmjs.org/

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish --registry=https://npm.pkg.github.com/
      # - name: Publish to GitHub Packages
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
      #   run: |
      #     echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
      #     npm publish --registry=https://npm.pkg.github.com/

  build:
    needs: publish
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load envs
        run: |
          . "./common/bin/envs.sh";
          echo "IMAGE_REGISTRY_URL=$IMAGE_REGISTRY_URL" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY_URL }}/devops:${{ github.ref_name }}
            ${{ env.IMAGE_REGISTRY_URL }}/devops:latest

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GH_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag image for GitHub Container Registry
        run: |
          docker tag ${{ env.IMAGE_REGISTRY_URL }}/devops:${{ github.ref_name }} ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          docker tag ${{ env.IMAGE_REGISTRY_URL }}/devops:${{ github.ref_name }} ghcr.io/${{ github.repository }}:latest

      - name: Push image to GitHub Container Registry (version tag)
        run: docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Push image to GitHub Container Registry (latest tag)
        run: docker push ghcr.io/${{ github.repository }}:latest
