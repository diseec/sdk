name: Release

on:
  release:
    types: [published]
  push:
    branches: [main]

jobs:
  auto-release:
    if: github.event_name == 'push'
    runs-on: self-hosted
    container:
      image: node:20-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest tag and increment patch
        id: version
        run: |
          # Get the latest tag, default to v0.0.0 if no tags exist
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Remove 'v' prefix and split version
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          NEW_TAG="v$NEW_VERSION"

          echo "New version: $NEW_VERSION"
          echo "New tag: $NEW_TAG"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          release_name: Release ${{ steps.version.outputs.tag }}
          body: |
            Auto-generated release from main branch push

            **Changes:**
            - Automatic patch version increment
            - Latest commit: ${{ github.sha }}
          draft: false
          prerelease: false

  publish:
    # This job runs for BOTH auto-releases (from push) AND manual releases
    if: github.event_name == 'release'
    runs-on: self-hosted
    container:
      image: node:20-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install dependencies
        run: npm install

      - name: Set package.json version from release tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          npm version --no-git-tag-version $TAG_VERSION

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish --registry=https://npm.pkg.github.com/

  build:
    needs: publish
    if: github.event_name == 'release'
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load envs
        run: |
          . D envs; # need to cd to the root of the project this way it uses the servers global D envs
          echo "IMAGE_REGISTRY_URL=$IMAGE_REGISTRY_URL" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_REGISTRY_URL }}/kit:latest
          cache-from: type=registry,ref=${{ env.IMAGE_REGISTRY_URL }}/kit:cache
          cache-to: type=registry,ref=${{ env.IMAGE_REGISTRY_URL }}/kit:cache,mode=max

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GH_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Pull image from registry
        run: docker pull ${{ env.IMAGE_REGISTRY_URL }}/kit:latest
      - name: Tag image for GitHub Container Registry
        run: docker tag ${{ env.IMAGE_REGISTRY_URL }}/kit:latest ghcr.io/${{ github.repository }}:latest

      - name: Push image to GitHub Container Registry (latest tag)
        run: docker push ghcr.io/${{ github.repository }}:latest
