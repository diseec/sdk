name: Release

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: self-hosted
    container:
      image: node:20-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install dependencies
        run: npm install

      - name: Set package.json version from release tag
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          npm version --no-git-tag-version $TAG_VERSION

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
