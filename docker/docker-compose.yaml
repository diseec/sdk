services:
  sdk:
    image: "$D_REGISTRY_URL/$D_SDK_NAME"
    command: ["sleep", "infinity"]
    entrypoint: "/entrypoints/default.sh"
    build:
      context: "$D_SDK_DIR"
      dockerfile: "$D_SDK_DIR/docker/Dockerfile"
    working_dir: "$D_CONT_CTX_DIR"
    environment:
      # NOTE: wrapping these values in "" for some reason the qoutes merge into the values
      - D_HOST_UID=$D_HOST_UID
      - D_HOST_GID=$D_HOST_GID
      - D_ENV=$D_ENV
      - D_DEBUG=$D_DEBUG
      - D_LOG_LEVEL=$D_LOG_LEVEL
      - D_RECURSIVE=$D_RECURSIVE
      - D_AUTO=$D_AUTO
      - D_PATCH=$D_PATCH
    # - GIT_DISCOVERY_ACROSS_FILESYSTEM=1
    # - GIT_TERMINAL_PROMPT=0 # avoid interactive prompts
