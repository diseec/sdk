services:
  sdk:
    image: "$D_REGISTRY_URL/$D_SDK_NAME"
    command: ["sleep", "infinity"]
    entrypoint: "/entrypoints/default.sh"
    build:
      context: "$D_SDK_DIR"
      dockerfile: "$D_SDK_DIR/docker/Dockerfile"
    working_dir: "$D_CONT_CTX_DIR"
    environment:
      - D_ENV="$D_ENV"
      - D_GLOBAL_LOG_LEVEL="$D_GLOBAL_LOG_LEVEL"
      - D_GLOBAL_TTY_AVAILABLE="$D_GLOBAL_TTY_AVAILABLE"
      - D_GLOBAL_SDK_PATCH_FORCE="$D_GLOBAL_SDK_PATCH_FORCE"
      - D_GLOBAL_IS_RECURSIVE="$D_GLOBAL_IS_RECURSIVE"
      - D_GLOBAL_IS_QUIET="$D_GLOBAL_IS_QUIET"
    # - GIT_DISCOVERY_ACROSS_FILESYSTEM=1
    # - GIT_TERMINAL_PROMPT=0 # avoid interactive prompts
