services:
  sdk:
    extends:
      file: "$D_SDK_DIR/docker/docker-compose.yaml"
      service: sdk
    image: "$D_REGISTRY_URL/$D_SDK_NAME"
    volumes:
      - "$D_HOST_CTX_DIR:$D_CONT_CTX_DIR"
      - "$HOME:$D_CONT_HOME_DIR"
      - "$D_ORG_DIR:$D_CONT_ORG_DIR"
      - "$D_GIT_DIR:$D_CONT_GIT_DIR"
