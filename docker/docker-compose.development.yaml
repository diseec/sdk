services:
  sdk:
    extends:
      file: "$D_SDK_DIR/docker/docker-compose.yaml"
      service: sdk
    image: "$D_REGISTRY_URL/$D_SDK_NAME"
    volumes:
      # - "$HOME:$D_CONT_HOME_DIR"
      # - "$HOME/.gitconfig:$D_CONT_HOME_DIR/.gitconfig"
      # - "$HOME/.config:$D_CONT_HOME_DIR/.config"
      - "$HOME/.git-credentials:$D_CONT_HOME_DIR/.git-credentials"
      - "$D_TARGET_CTX_DIR:$D_CONT_CTX_DIR"
      - "$D_ORG_DIR:$D_CONT_ORG_DIR"
      - "$D_GIT_DIR:$D_CONT_GIT_DIR"
