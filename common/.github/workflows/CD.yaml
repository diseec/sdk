name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  prepare:
    runs-on: self-hosted
    container:
      image: alpine
    outputs:
      repo_name: ${{ steps.vars.outputs.repo_name }}
      project_id: ${{ steps.vars.outputs.project_id }}
      project_name: ${{ steps.vars.outputs.project_name }}
      image_name: ${{ steps.vars.outputs.image_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate dynamic values
        id: vars
        run: |
          REPO_NAME=$(basename $GITHUB_REPOSITORY)
          PROJECT_ID=$(echo $REPO_NAME | cut -d'-' -f1)
          PROJECT_NAME=$(echo $REPO_NAME | cut -d'-' -f2-)
          IMAGE_NAME="registry.diseec.com/${PROJECT_ID}-${PROJECT_NAME}"
          echo "::set-output name=project_id::$PROJECT_ID"
          echo "::set-output name=project_name::$PROJECT_NAME"
          echo "::set-output name=image_name::$IMAGE_NAME"

  build:
    needs: [prepare]
    runs-on: self-hosted

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.image_name }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image_name }}:cache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image_name }}:cache,mode=max

  test:
    needs: [prepare, build]
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run install
        run: sh cli install

      - name: Run all kind of tests!
        run: sh cli test

  deploy:
    needs: [prepare, test]
    runs-on: self-hosted
    container:
      image: alpine

    steps:
      - name: Update pods
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: cli update ${{ needs.prepare.outputs.project_id }} ${{ needs.prepare.outputs.project_name }}
